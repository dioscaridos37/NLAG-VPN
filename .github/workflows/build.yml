name: Build NLAG-VPN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project if zip present
        run: |
          if [ -f NLAG-VPN.zip ]; then
            echo "Found NLAG-VPN.zip — unpacking..."
            unzip -o NLAG-VPN.zip
            
            if [ -d NLAG-VPN ]; then
              # Copy everything except .github (we already have the workflow)
              shopt -s dotglob
              for item in NLAG-VPN/*; do
                name=$(basename "$item")
                if [ "$name" = ".github" ]; then
                  # merge workflows if needed
                  mkdir -p .github/workflows
                  cp -r NLAG-VPN/.github/workflows/* .github/workflows/ 2>/dev/null || true
                else
                  rm -rf "./$name"
                  mv "$item" .
                fi
              done
              rm -rf NLAG-VPN
            fi
          fi
          echo "=== Root contents ==="
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin || true
          chmod +x gradlew 2>/dev/null || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NLAG-VPN-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
